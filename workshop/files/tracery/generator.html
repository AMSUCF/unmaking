<!DOCTYPE html>
<!-- Act II: a one-file Tracery generator. Paste your grammar into the box below (or into GRAMMAR in this file),
     press Regenerate, and keep the file: it runs offline, and you can host it anywhere that serves HTML. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracery Generator</title>
  <script src="../../vendor/tracery.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e9e0cc; color: #2d2a4a; font: 18px/1.5 'Courier New', monospace; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
    h1 { margin: 0; color: #7b4fb3; }
    #out { margin: 0; padding: 28px; min-height: 5em; background: #fbf6ea; border: 3px dashed #7b4fb3; border-radius: 8px; font-size: 24px; }
    button { justify-self: start; font: inherit; padding: 8px 18px; background: #7b4fb3; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #c0544a; outline-offset: 2px; }
    textarea { width: 100%; min-height: 280px; padding: 12px; background: #fff; color: #2d2a4a; border: 2px solid #cfc3a6; font: 15px/1.4 'Courier New', monospace; }
    #status { margin: 0; color: #c0544a; min-height: 1.4em; }
  </style>
</head>
<body>
<main>
  <h1>My Generator</h1>
  <p id="out" aria-live="polite"></p>
  <button type="button" id="again">Regenerate</button>
  <label for="grammar">Grammar (JSON):</label>
  <textarea id="grammar" spellcheck="false"></textarea>
  <p id="status" role="status"></p>
</main>
<script>
// Replace this grammar with your own. "origin" is where every expansion starts.
const GRAMMAR = {
  "origin": ["#maker.capitalize# #made# #thing.a# out of #material#, #because#."],
  "maker": ["a quilter", "my grandmother", "a student", "the bot", "a librarian", "someone on GeoCities"],
  "made": ["stitched", "folded", "photocopied", "coded", "pieced", "remixed"],
  "thing": ["map", "archive", "love letter", "zine", "game", "website", "sampler"],
  "material": ["old t-shirts", "index cards", "borrowed code", "dead links", "thread", "a broken printer"],
  "because": ["because the platform closed", "for a friend", "to remember", "just to see if it would work", "because no one else would", "and then gave it away"]
};

const box = document.getElementById('grammar');
const status = document.getElementById('status');
box.value = JSON.stringify(GRAMMAR, null, 2);

function generate() {
  let raw;
  try { raw = JSON.parse(box.value); } catch (e) { status.textContent = 'Check your JSON: ' + e.message; return; }
  if (!raw.origin) { status.textContent = 'Your grammar needs an "origin" rule.'; return; }
  status.textContent = '';
  const grammar = tracery.createGrammar(raw);
  grammar.addModifiers(tracery.baseEngModifiers);
  document.getElementById('out').textContent = grammar.flatten('#origin#');
}

document.getElementById('again').addEventListener('click', generate);
box.addEventListener('input', () => { clearTimeout(box.t); box.t = setTimeout(generate, 500); });
generate();
</script>
</body>
</html>
