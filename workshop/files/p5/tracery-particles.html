<!DOCTYPE html>
<!-- Act III, step 2: Tracery inside p5.js. Each click flattens the grammar into a new line that drifts and fades.
     Adapted from the ENG 6819 Critical Making demo (materials/mySketch.js), which builds on an example by Allison Parrish.
     Swap in your grammar from Act II: paste it over grammarSource below. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracery Particles</title>
  <script src="../../vendor/p5.min.js"></script>
  <script src="../../vendor/tracery.js"></script>
  <style>html, body { margin: 0; background: #323232; } canvas { display: block; }</style>
</head>
<body>
<script>
// The grammar. Each "#symbol#" is replaced with a random choice from its list.
// [myPlace:#path#] saves one choice so the line can use the same place twice.
const grammarSource = {
  "origin": ["[myPlace:#path#]#line#"],
  "line": ["#mood.capitalize# and #mood#, the #myPlace# was #mood# with #substance#", "#nearby.capitalize# #myPlace.a# #move.ed# through the #path#, filling me with #substance#"],
  "nearby": ["beyond the #path#", "far away", "ahead", "behind me"],
  "substance": ["light", "reflections", "mist", "shadow", "darkness", "brightness", "gaiety", "merriment"],
  "mood": ["overcast", "alight", "clear", "darkened", "blue", "shadowed", "illuminated", "silver", "cool", "warm", "summer-warmed"],
  "path": ["stream", "brook", "path", "ravine", "forest", "fence", "stone wall"],
  "move": ["spiral", "twirl", "curl", "dance", "twine", "weave", "meander", "wander", "flow"]
};

let grammar;
const particles = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  grammar = tracery.createGrammar(grammarSource);
  grammar.addModifiers(tracery.baseEngModifiers);   // .capitalize, .a, .s, .ed
  textFont('Courier New');
  textAlign(CENTER, CENTER);
}

function draw() {
  background(50, 50, 50, 50);                      // TRY: lower the last number for longer trails
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].show();
    if (particles[i].finished()) particles.splice(i, 1);
  }
  if (!particles.length) {
    fill(200); noStroke(); textSize(18);
    text('click anywhere', width / 2, height / 2);
  }
}

function mouseClicked() {
  particles.push(new Particle(mouseX, mouseY, grammar.flatten('#origin#')));
}

class Particle {
  constructor(x, y, line) {
    this.x = x;
    this.y = y;
    this.vx = random(-1, 1);                       // TRY: random(0, 2) so every line drifts right
    this.vy = random(-1, 1);
    this.size = random(15, 50);
    this.line = line;
    this.alpha = 255;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= 0.6;                             // TRY: fade faster or slower
  }
  finished() {
    return this.alpha <= 0 || this.x < -width || this.x > 2 * width || this.y < -100 || this.y > height + 100;
  }
  show() {
    noStroke();
    textSize(this.size);
    fill(120, 220, 120, this.alpha);               // TRY: random colours, or stroke(255) for an outline
    text(this.line, this.x, this.y);
  }
}
</script>
</body>
</html>
